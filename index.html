<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>감정카드 선택하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>나의 감정 탐색기</h1>
      <p>아래로 당겨서 감정을 담아보세요</p>
    </div>
    <div class="header-tools">
      <button class="icon-btn" onclick="shuffleCards()">🔀 섞기</button>
      <label class="toggle-label">
        <input type="checkbox" id="showNumberToggle" onchange="toggleCardNumber()">
        번호
      </label>
    </div>
  </header>

  <main>
    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterEmotions('all', event)">전체 (70)</button>
      <button class="filter-chip" onclick="filterEmotions('positive', event)">긍정/행복</button>
      <button class="filter-chip" onclick="filterEmotions('calm', event)">편안/안정</button>
      <button class="filter-chip" onclick="filterEmotions('negative', event)">슬픔/답답</button>
    </div>

    <div class="card-deck" id="cardDeck"></div>

    <div class="controls">
      <button class="nav-btn" onclick="prevCard()">←</button>
      <button class="select-btn" onclick="selectCurrentCard()">감정 담기 ↓</button>
      <button class="nav-btn" onclick="nextCard()">→</button>
    </div>
  </main>

  <section class="selected-section">
    <div class="selected-header">
      <div class="selected-title">
        선택한 감정 <span class="badge" id="selectedCount">0</span>
      </div>
      <div class="selected-header-actions">
        <button class="reset-btn" onclick="resetEmotions()">초기화</button>
        <button class="confirm-btn" id="confirmBtn" disabled onclick="openModal()">확인</button>
      </div>
    </div>

    <div class="selected-cards-container" id="selectedContainer">
      <div class="empty-msg">아직 선택된 감정이 없습니다</div>
    </div>
  </section>

  <!-- 팝업 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close-x" onclick="closeModal()">✕</button>

      <div class="modal-title">오늘 나의 마음 기록 💡</div>
      <div class="modal-desc">감정별로 하고 싶은 이야기를 적어보세요</div>
      
      <div class="modal-list" id="modalList"></div>
      
      <div class="modal-icon-actions">
        <button class="action-icon-btn danger" onclick="resetEmotions()">
          <div class="action-icon-circle">🗑️</div>
          <span>초기화</span>
        </button>

        <button class="action-icon-btn" onclick="copySelectedEmotions()">
          <div class="action-icon-circle">📋</div>
          <span>복사하기</span>
        </button>

        <button class="action-icon-btn primary" onclick="shareOnlyEmotions()">
          <div class="action-icon-circle">🎴</div>
          <span>감정 공유</span>
        </button>

        <button class="action-icon-btn accent" onclick="shareEmotionsWithNotes()">
          <div class="action-icon-circle">📝</div>
          <span>내용 공유</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script src="emotionsData.js"></script>
  <script src="script.js"></script>

  <!-- 초기화 확인 커스텀 모달 -->
  <div class="modal-overlay" id="confirmResetModal">
    <div class="modal-content" style="max-width: 300px;">
      <div class="modal-title">감정 초기화 🔄</div>
      <div class="modal-desc" style="margin-bottom: 20px;">
        담았던 감정이 모두 지워집니다.<br>정말 초기화하시겠어요?
      </div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="icon-btn" style="flex: 1; padding: 10px; justify-content: center;" onclick="closeResetModal()">
          취소
        </button>
        <button class="icon-btn" style="flex: 1; padding: 10px; justify-content: center; background: #ff7675; color: white; border: none;" onclick="executeReset()">
          초기화
        </button>
      </div>
    </div>
  </div>

</body>
</html>
