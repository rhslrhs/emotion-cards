<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>감정카드 선택하기</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary-color: #6c5ce7;
      --primary-hover: #5b4bc4;
      --text-dark: #2d3436;
      --text-muted: #636e72;
      --accent-color: #00b894;
      --border-color: #dfe6e9;
      --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 상단 헤더 */
    header {
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-titles h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header-titles p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 셔플 버튼 & 토글 스위치 */
    .icon-btn {
      background: #f1f2f6;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* 메인 인터랙티브 영역 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
    }

    /* 카테고리 필터 태그 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
      width: 100%;
      max-width: 360px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      background: #e2e8f0;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--primary-color);
      color: white;
    }

    /* 카드 슬라이더 영역 */
    .card-deck {
      position: relative;
      width: 280px;
      height: 380px;
      perspective: 1000px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      cursor: grab;
      transition: transform 0.25s ease, opacity 0.25s ease;
      border: 2px solid transparent;
      will-change: transform;
    }

    /* 추가 감정 카드 구분 스타일 */
    .card.extra-card {
      border: 2px dashed #fd79a8;
      background: #fff8fa;
    }

    .card-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-id {
      font-size: 0.85rem;
      font-weight: 800;
      color: #b2bec3;
    }

    .card-id.hidden {
      visibility: hidden;
    }

    .extra-badge {
      background: #fd79a8;
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: 700;
    }

    .card-emoji {
      font-size: 4rem;
      margin-top: 5px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
      text-align: center;
    }

    .card-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--accent-color);
      font-weight: 600;
      background: rgba(0, 184, 148, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 컨트롤 */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .select-btn {
      padding: 12px 24px;
      border-radius: 25px;
      background: var(--primary-color);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
      cursor: pointer;
    }

    /* 하단 선택 카드 섹션 */
    .selected-section {
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .selected-title {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: var(--primary-color);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .confirm-btn {
      padding: 8px 16px;
      border-radius: 16px;
      background: var(--accent-color);
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .confirm-btn:disabled {
      background: #b2bec3;
      cursor: not-allowed;
    }

    .selected-cards-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      min-height: 50px;
      align-items: center;
      scrollbar-width: thin;
    }

    .selected-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f2f6;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .selected-chip.is-extra {
      border-color: #fd79a8;
      background: #fff0f5;
    }

    .selected-chip .remove-btn {
      background: none;
      border: none;
      color: #a4b0be;
      font-size: 1rem;
      cursor: pointer;
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 100%;
      text-align: center;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex; justifyContent: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      z-index: 100; padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1; pointer-events: auto;
    }

    .modal-content {
      background: white; width: 100%; max-width: 340px;
      border-radius: 24px; padding: 24px; text-align: center;
    }

    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
    .modal-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

    .modal-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 20px;
      max-height: 200px; overflow-y: auto;
    }

    .modal-tag {
      background: #f1f2f6; padding: 8px 12px;
      border-radius: 16px; font-size: 0.9rem; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }

    .close-btn {
      width: 100%; padding: 12px;
      background: var(--primary-color); color: white;
      border: none; border-radius: 16px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>나의 감정 탐색기</h1>
      <p>아래로 당겨서 감정을 담아보세요</p>
    </div>
    <div class="header-tools">
      <button class="icon-btn" onclick="shuffleCards()">🔀 섞기</button>
      <label class="toggle-label">
        <input type="checkbox" id="showNumberToggle" checked onchange="toggleCardNumber()">
        번호
      </label>
    </div>
  </header>

  <main>
    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterEmotions('all')">전체 (70)</button>
      <button class="filter-chip" onclick="filterEmotions('positive')">긍정/행복</button>
      <button class="filter-chip" onclick="filterEmotions('calm')">편안/안정</button>
      <button class="filter-chip" onclick="filterEmotions('negative')">슬픔/답답</button>
    </div>

    <div class="card-deck" id="cardDeck"></div>

    <div class="controls">
      <button class="nav-btn" onclick="prevCard()">←</button>
      <button class="select-btn" onclick="selectCurrentCard()">감정 담기 ↓</button>
      <button class="nav-btn" onclick="nextCard()">→</button>
    </div>
  </main>

  <section class="selected-section">
    <div class="selected-header">
      <div class="selected-title">
        선택한 감정 <span class="badge" id="selectedCount">0</span>
      </div>
      <button class="confirm-btn" id="confirmBtn" disabled onclick="openModal()">최종 확인</button>
    </div>

    <div class="selected-cards-container" id="selectedContainer">
      <div class="empty-msg">아직 선택된 감정이 없습니다</div>
    </div>
  </section>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-title">오늘 나의 마음 모음 💡</div>
      <div class="modal-desc">지금 느끼는 마음을 확인해보세요</div>
      <div class="modal-tags" id="modalTags"></div>
      <button class="close-btn" onclick="closeModal()">완료</button>
    </div>
  </div>

  <script>
    const baseEmotions = [
      { id: "01", name: "편안한", category: "calm", emoji: "🌿" },
      { id: "02", name: "따뜻한", category: "calm", emoji: "☀️" },
      { id: "03", name: "반가운", category: "positive", emoji: "👋" },
      { id: "04", name: "흥미로운", category: "positive", emoji: "🔍" },
      { id: "05", name: "궁금한", category: "positive", emoji: "🧐" },
      { id: "06", name: "자랑스러운", category: "positive", emoji: "👑" },
      { id: "07", name: "느긋한", category: "calm", emoji: "☕" },
      { id: "08", name: "행복한", category: "positive", emoji: "🥰" },
      { id: "09", name: "신나는", category: "positive", emoji: "🎉" },
      { id: "10", name: "기대되는", category: "positive", emoji: "✨" },
      { id: "11", name: "감사한", category: "positive", emoji: "🙏" },
      { id: "12", name: "통쾌한", category: "positive", emoji: "💥" },
      { id: "13", name: "다정한", category: "positive", emoji: "🌸" },
      { id: "14", name: "재미있는", category: "positive", emoji: "😆" },
      { id: "15", name: "감동한", category: "positive", emoji: "🥺" },
      { id: "16", name: "사랑스러운", category: "positive", emoji: "❤️" },
      { id: "17", name: "뿌듯한", category: "positive", emoji: "🌟" },
      { id: "18", name: "만족스러운", category: "calm", emoji: "😊" },
      { id: "19", name: "든든한", category: "calm", emoji: "🛡️" },
      { id: "20", name: "열중한", category: "positive", emoji: "🔥" },
      { id: "21", name: "창피한/수줍은", category: "negative", emoji: "😳" },
      { id: "22", name: "슬픈", category: "negative", emoji: "💧" },
      { id: "23", name: "지루한", category: "negative", emoji: "🥱" },
      { id: "24", name: "답답한", category: "negative", emoji: "😤" },
      { id: "25", name: "짜증나는", category: "negative", emoji: "💢" },
      { id: "26", name: "서운한", category: "negative", emoji: "🌧️" },
      { id: "27", name: "마음이아픈", category: "negative", emoji: "💔" },
      { id: "28", name: "걱정스러운", category: "negative", emoji: "😟" },
      { id: "29", name: "지친", category: "negative", emoji: "🔋" },
      { id: "30", name: "무서운", category: "negative", emoji: "😱" },
      { id: "31", name: "긴장된", category: "negative", emoji: "😬" },
      { id: "32", name: "불안한", category: "negative", emoji: "😰" },
      { id: "33", name: "외로운", category: "negative", emoji: "🎈" },
      { id: "34", name: "실망스러운", category: "negative", emoji: "😞" },
      { id: "35", name: "화가난", category: "negative", emoji: "😡" },
      { id: "36", name: "후회스러운", category: "negative", emoji: "🌧️" },
      { id: "37", name: "불쾌한", category: "negative", emoji: "😖" },
      { id: "38", name: "괴로운/고통스러운", category: "negative", emoji: "🩹" },
      { id: "39", name: "미안한", category: "negative", emoji: "🙇" },
      { id: "40", name: "귀찮은", category: "negative", emoji: "🛋️" },
      { id: "41", name: "기쁜", category: "positive", emoji: "😄" },
      { id: "42", name: "흥분된/황홀한", category: "positive", emoji: "🤩" },
      { id: "43", name: "안정된", category: "calm", emoji: "⚓" },
      { id: "44", name: "자신감있는", category: "positive", emoji: "💪" },
      { id: "45", name: "활기있는", category: "positive", emoji: "⚡" },
      { id: "46", name: "생기가도는", category: "positive", emoji: "🌱" },
      { id: "47", name: "편한/가벼운", category: "calm", emoji: "🎈" },
      { id: "48", name: "안심되는", category: "calm", emoji: "😌" },
      { id: "49", name: "명확해진", category: "calm", emoji: "💡" },
      { id: "50", name: "가슴뭉클한", category: "positive", emoji: "💖" },
      { id: "51", name: "우울한", category: "negative", emoji: "☁️" },
      { id: "52", name: "속상한", category: "negative", emoji: "😿" },
      { id: "53", name: "겁나는", category: "negative", emoji: "😨" },
      { id: "54", name: "미운", category: "negative", emoji: "😠" },
      { id: "55", name: "피곤한", category: "negative", emoji: "💤" },
      { id: "56", name: "억울한", category: "negative", emoji: "🥺" },
      { id: "57", name: "불편한", category: "negative", emoji: "😣" },
      { id: "58", name: "놀란", category: "negative", emoji: "😲" },
      { id: "59", name: "심란한", category: "negative", emoji: "🌀" },
      { id: "60", name: "무관심한", category: "calm", emoji: "😶" }
    ];

    // 추가 10개 감정 (61 ~ 70)
    const extraEmotions = [
      { id: "61", name: "설레는", category: "positive", emoji: "💓", isExtra: true },
      { id: "62", name: "아련한", category: "calm", emoji: "🌌", isExtra: true },
      { id: "63", name: "씁쓸한", category: "negative", emoji: "☕", isExtra: true },
      { id: "64", name: "홀가분한", category: "calm", emoji: "🕊️", isExtra: true },
      { id: "65", name: "벅차오르는", category: "positive", emoji: "🎆", isExtra: true },
      { id: "66", name: "허전한", category: "negative", emoji: "🍂", isExtra: true },
      { id: "67", name: "벅찬", category: "positive", emoji: "🌈", isExtra: true },
      { id: "68", name: "멍한", category: "calm", emoji: "😶‍🌫️", isExtra: true },
      { id: "69", name: "평화로운", category: "calm", emoji: "🏡", isExtra: true },
      { id: "70", name: "울컥하는", category: "negative", emoji: "💧", isExtra: true }
    ];

    const emotionsData = [...baseEmotions, ...extraEmotions];
    let filteredData = [...emotionsData];
    let currentIndex = 0;
    let showNumber = true;
    const selectedEmotions = new Map(); // 객체 형태로 이모지와 함께 저장

    const cardDeck = document.getElementById('cardDeck');
    const selectedContainer = document.getElementById('selectedContainer');
    const selectedCount = document.getElementById('selectedCount');
    const confirmBtn = document.getElementById('confirmBtn');

    function renderDeck() {
      cardDeck.innerHTML = '';
      if (filteredData.length === 0) {
        cardDeck.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100%; color:#b2bec3;">카드가 없습니다</div>';
        return;
      }

      for (let i = currentIndex; i < Math.min(currentIndex + 3, filteredData.length); i++) {
        const item = filteredData[i];
        const cardIndex = i - currentIndex;
        
        const card = document.createElement('div');
        card.className = `card ${item.isExtra ? 'extra-card' : ''}`;
        
        const scale = 1 - cardIndex * 0.05;
        const translateY = cardIndex * 15;
        card.style.transform = `translateY(${translateY}px) scale(${scale})`;
        card.style.zIndex = 10 - cardIndex;
        card.style.opacity = 1 - cardIndex * 0.2;

        card.innerHTML = `
          <div class="card-top-row">
            <span class="card-id ${showNumber ? '' : 'hidden'}">NO. ${item.id}</span>
            ${item.isExtra ? '<span class="extra-badge">추가</span>' : '<span></span>'}
          </div>
          <div class="card-emoji">${item.emoji}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-hint">↓ 아래로 당겨 담기</div>
        `;

        if (cardIndex === 0) attachTouchEvents(card, item);
        cardDeck.appendChild(card);
      }
    }

    function attachTouchEvents(card, emotionItem) {
      let startX = 0, startY = 0, currentX = 0, currentY = 0, isDragging = false;

      const onStart = (e) => {
        isDragging = true;
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY;
        card.style.transition = 'none';
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const touch = e.touches ? e.touches[0] : e;
        currentX = touch.clientX - startX; currentY = touch.clientY - startY;
        card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.05}deg)`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';

        if (currentY > 100) {
          card.style.transform = 'translateY(300px)';
          card.style.opacity = '0';
          setTimeout(() => { addEmotion(emotionItem); nextCard(); }, 200);
        } else if (currentX < -100) {
          card.style.transform = 'translateX(-300px)';
          setTimeout(() => nextCard(), 200);
        } else if (currentX > 100) {
          card.style.transform = 'translateX(300px)';
          setTimeout(() => prevCard(), 200);
        } else {
          card.style.transform = 'translate(0, 0)';
        }
      };

      card.addEventListener('touchstart', onStart, { passive: true });
      card.addEventListener('touchmove', onMove, { passive: true });
      card.addEventListener('touchend', onEnd);
      card.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    function nextCard() {
      currentIndex = (currentIndex < filteredData.length - 1) ? currentIndex + 1 : 0;
      renderDeck();
    }

    function prevCard() {
      if (currentIndex > 0) { currentIndex--; renderDeck(); }
    }

    function selectCurrentCard() {
      if (filteredData.length === 0) return;
      addEmotion(filteredData[currentIndex]);
      nextCard();
    }

    function addEmotion(item) {
      if (!selectedEmotions.has(item.name)) {
        selectedEmotions.set(item.name, item);
        updateSelectedUI();
      }
    }

    function removeEmotion(name) {
      selectedEmotions.delete(name);
      updateSelectedUI();
    }

    function updateSelectedUI() {
      selectedCount.textContent = selectedEmotions.size;
      confirmBtn.disabled = selectedEmotions.size === 0;

      if (selectedEmotions.size === 0) {
        selectedContainer.innerHTML = '<div class="empty-msg">아직 선택된 감정이 없습니다</div>';
        return;
      }

      selectedContainer.innerHTML = '';
      selectedEmotions.forEach((item, name) => {
        const chip = document.createElement('div');
        chip.className = `selected-chip ${item.isExtra ? 'is-extra' : ''}`;
        chip.innerHTML = `
          <span>${item.emoji} ${name}</span>
          <button class="remove-btn" onclick="removeEmotion('${name}')">&times;</button>
        `;
        selectedContainer.appendChild(chip);
      });
      selectedContainer.scrollLeft = selectedContainer.scrollWidth;
    }

    function shuffleCards() {
      for (let i = filteredData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredData[i], filteredData[j]] = [filteredData[j], filteredData[i]];
      }
      currentIndex = 0;
      renderDeck();
    }

    function toggleCardNumber() {
      showNumber = document.getElementById('showNumberToggle').checked;
      renderDeck();
    }

    function filterEmotions(category) {
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') filteredData = [...emotionsData];
      else filteredData = emotionsData.filter(item => item.category === category);
      
      currentIndex = 0;
      renderDeck();
    }

    function openModal() {
      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = '';
      selectedEmotions.forEach((item, name) => {
        const tag = document.createElement('span');
        tag.className = 'modal-tag';
        tag.textContent = `${item.emoji} ${name}`;
        modalTags.appendChild(tag);
      });
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    renderDeck();
  </script>
</body>
</html>
